<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240" role="img" aria-labelledby="title description">
  <title id="title">Support independent open source</title>
  <desc id="description">Help shape NotchMaster through ideas, contributions, and future donations. No payment destination is connected.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="0">
      <stop stop-color="#111D2C"/>
      <stop offset="1" stop-color="#161327"/>
    </linearGradient>
    <linearGradient id="heart" x2="1" y2="1">
      <stop stop-color="#64E7F3"/>
      <stop offset="1" stop-color="#9387FF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1438" height="238" rx="26" fill="url(#canvas)" stroke="#30384E"/>
  <circle cx="114" cy="120" r="49" fill="#1C2A3E" stroke="#43506B"/>
  <path d="M114 143L93 123C75 105 96 87 109 102L114 108L119 102C132 87 153 105 135 123Z" fill="none" stroke="url(#heart)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="199" y="91" fill="#64E7F3" font-size="12" font-weight="600" letter-spacing="2.5">BUILT IN THE OPEN</text>
    <text x="197" y="133" fill="#F5F7FF" font-size="32" font-weight="650">Support independent open source.</text>
    <text x="199" y="173" fill="#B6C1D6" font-size="19">Ideas, contributions, and a little encouragement go a long way.</text>
    <rect x="1140" y="97" width="210" height="46" rx="23" fill="#28263F" stroke="#605B86"/>
    <text x="1245" y="126" fill="#DED8FF" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">DONATIONS LATER</text>
  </g>
</svg>
