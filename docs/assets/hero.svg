<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title description">
  <title id="title">Your notch. More possibilities.</title>
  <desc id="description">NotchMaster concept artwork. An illuminated notch expands into a modular hub. This is not an app screenshot.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#111A2D"/>
      <stop offset="1" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0.6">
      <stop stop-color="#64E7F3"/>
      <stop offset="1" stop-color="#9387FF"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#5479C7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5479C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1438" height="498" rx="30" fill="url(#canvas)" stroke="#273247"/>
  <ellipse cx="1080" cy="240" rx="350" ry="250" fill="url(#aura)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
