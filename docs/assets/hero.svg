    <text x="131.5" y="405" fill="#CAD4E8" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">CONCEPT</text>
    <text x="205" y="405" fill="#B6C1D6" font-size="14">Designed for a native macOS experience.</text>
  </g>
