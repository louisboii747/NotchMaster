    <text x="72" y="185" fill="#F5F7FF" font-size="64" font-weight="700" letter-spacing="-2">Your notch.</text>
    <text x="72" y="262" fill="#F5F7FF" font-size="64" font-weight="700" letter-spacing="-2">More possibilities.</text>
    <text x="76" y="325" fill="#B6C1D6" font-size="21">Glance. Expand. Make it yours.</text>
